<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Kritik Seçim">
<meta name="theme-color" content="#0d0f1a">
<title>Kritik Seçim Espor</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { background:#0d0f1a; color:#e8eaf6; font-family:Arial,sans-serif;
         margin:0; display:flex; justify-content:center; padding:20px; min-height:100vh; }

  /* Arka plan ışık hâleleri */
  body::before { content:""; position:fixed; top:0; left:0; right:0; bottom:0; z-index:-1;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,77,255,.22), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(0,229,255,.14), transparent 45%);
    animation: arkaPlan 8s ease-in-out infinite; }

  #oyun { width:100%; max-width:480px; }

  h1 { text-align:center; margin:0 0 22px; font-size:26px; letter-spacing:1px;
       background:linear-gradient(90deg,#7c4dff,#00e5ff);
       -webkit-background-clip:text; background-clip:text;
       -webkit-text-fill-color:transparent; color:transparent;
       animation: baslikParla 4s ease-in-out infinite; }
  h2 { text-align:center; margin:0 0 16px; font-size:20px; }

  .ekran { display:none; }
  .ekran.aktif { display:block; animation: ekranGiris .35s ease-out; }

  /* Ana menü resmi */
  .logo { display:block; margin:0 auto 20px; width:130px; height:130px;
          border-radius:29px; box-shadow:0 0 28px rgba(124,77,255,.55), 0 0 60px rgba(0,229,255,.18);
          animation: logoParla 4s ease-in-out infinite; }

  /* Göstergeler */
  .stats { display:flex; gap:8px; margin-bottom:20px; }
  .stat { flex:1; text-align:center; font-size:13px; padding:8px 2px; border-radius:10px; }
  .stat.artti { animation: yesilFlas .8s ease-out; }
  .stat.azaldi { animation: kirmiziFlas .8s ease-out; }
  .bar { height:10px; background:#252a44; border-radius:5px; margin-top:6px; overflow:hidden; margin-left:4px; margin-right:4px; }
  .dolu { height:100%; width:50%; border-radius:5px;
          background:linear-gradient(90deg,#00b8d4,#00e5ff);
          box-shadow:0 0 8px rgba(0,229,255,.55);
          transition:width .5s ease, background .4s; }
  .dolu.tehlike { background:linear-gradient(90deg,#ff1744,#ff5252);
                  box-shadow:0 0 10px rgba(255,82,82,.8);
                  animation: nabiz 1s ease-in-out infinite; }

  /* Kart */
  #kart { background:linear-gradient(160deg,#1a1f38,#141830);
          border:1px solid #2e3558; border-radius:14px;
          padding:24px; min-height:140px; font-size:18px; line-height:1.5;
          box-shadow:0 0 24px rgba(124,77,255,.15); }
  #kart.giris { animation: kartGiris .35s ease-out; }
  #kart.efektBasari { animation: basariParla .9s ease-out; }
  #kart.efektBasarisiz { animation: sars .5s ease-out, kirmiziParla .9s ease-out; }
  #kart.efektBitti { animation: sars .6s ease-out; border-color:#ff5252;
                     box-shadow:0 0 30px rgba(255,82,82,.45); }

  .basari { color:#69f0ae; font-weight:bold; }
  .basarisiz { color:#ff5252; font-weight:bold; }
  .uyari { color:#ffd740; font-weight:bold; font-size:15px; margin-bottom:12px;
           animation: nabiz 1s ease-in-out 2; }
  .etki { margin-top:14px; font-size:15px; line-height:1.8; }
  .art { color:#69f0ae; }
  .azal { color:#ff8a80; }
  .gider { color:#8a90b8; }

  /* Rekor */
  .yeniRekor { color:#ffd740; font-weight:bold; font-size:20px; margin-top:16px;
               text-shadow:0 0 12px rgba(255,215,64,.6); animation: nabiz 1s ease-in-out 3; }
  .rekorBilgi { color:#ffd740; font-size:15px; margin-top:16px; }
  .rekorKutu { display:flex; gap:8px; margin-bottom:18px; padding:12px 8px;
               background:#141830; border:1px solid #2e3558; border-radius:12px; }
  .rekorKutu div { flex:1; text-align:center; font-size:12px; color:#8a90b8; }
  .rekorKutu b { display:block; font-size:20px; color:#ffd740; margin-top:4px; }
  .rekorBaslik { text-align:center; font-size:12px; color:#8a90b8; margin-bottom:6px; letter-spacing:1px; }

  /* Butonlar */
  .butonlar { display:flex; gap:10px; margin-top:16px; }
  button { flex:1; padding:14px; font-size:15px; color:#fff;
           background:linear-gradient(135deg,#7c4dff,#6a3de8);
           border:none; border-radius:10px; cursor:pointer;
           box-shadow:0 4px 14px rgba(124,77,255,.35);
           transition:transform .12s, box-shadow .2s, filter .2s; }
  button:hover { filter:brightness(1.12); box-shadow:0 6px 18px rgba(124,77,255,.5); }
  button:active { transform:scale(.96); }
  button:disabled { opacity:.35; cursor:default; box-shadow:none; filter:none; transform:none; }
  button.ikincil { background:#252a44; box-shadow:none; }
  button.ikincil:hover { background:#323a60; }

  .menu-liste { display:flex; flex-direction:column; gap:12px; }
  .menu-liste button { flex:none; padding:18px; font-size:17px; }
  .menu-liste small { display:block; margin-top:4px; font-size:12px; opacity:.8; }
  .menu-liste small.rekorEtiket { color:#ffd740; opacity:1; font-weight:bold; }
  .ekran.aktif .menu-liste > * { animation: yukari .45s ease-out both; }
  .ekran.aktif .menu-liste > *:nth-child(1) { animation-delay:.03s; }
  .ekran.aktif .menu-liste > *:nth-child(2) { animation-delay:.10s; }
  .ekran.aktif .menu-liste > *:nth-child(3) { animation-delay:.17s; }
  .ekran.aktif .menu-liste > *:nth-child(4) { animation-delay:.24s; }

  .mod-btn { text-align:left; }
  .mod-btn b { font-size:18px; }

  #sayac { text-align:center; margin-top:16px; color:#8a90b8; font-size:14px; }
  #tehlikeYazi { text-align:center; margin-top:8px; color:#ff5252; font-size:14px;
                 font-weight:bold; min-height:18px; }

  .ustBar { display:flex; gap:8px; margin-bottom:14px; }
  .menu-kucuk { flex:none; width:auto; padding:8px 14px; font-size:13px; }

  textarea { width:100%; box-sizing:border-box; min-height:140px; padding:12px; font-size:16px;
             background:#171b30; color:#e8eaf6; border:1px solid #2e3558; border-radius:10px;
             font-family:Arial,sans-serif; }
  textarea:focus { outline:none; border-color:#7c4dff; box-shadow:0 0 12px rgba(124,77,255,.4); }
  .not { color:#8a90b8; font-size:13px; line-height:1.5; margin-top:12px; text-align:center; }

  /* Animasyonlar */
  @keyframes ekranGiris { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes yukari { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes kartGiris { from { opacity:0; transform:translateX(30px) rotate(2deg); } to { opacity:1; transform:none; } }
  @keyframes sars { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-8px); }
                    40% { transform:translateX(8px); } 60% { transform:translateX(-6px); }
                    80% { transform:translateX(6px); } }
  @keyframes basariParla {
    0%   { box-shadow:0 0 0 rgba(105,240,174,0); }
    35%  { box-shadow:0 0 32px rgba(105,240,174,.65); border-color:#69f0ae; }
    100% { box-shadow:0 0 24px rgba(124,77,255,.15); } }
  @keyframes kirmiziParla {
    0%   { box-shadow:0 0 0 rgba(255,82,82,0); }
    35%  { box-shadow:0 0 32px rgba(255,82,82,.65); border-color:#ff5252; }
    100% { box-shadow:0 0 24px rgba(124,77,255,.15); } }
  @keyframes yesilFlas { 0% { background:rgba(105,240,174,.38); } 100% { background:transparent; } }
  @keyframes kirmiziFlas { 0% { background:rgba(255,82,82,.38); } 100% { background:transparent; } }
  @keyframes nabiz { 0%,100% { opacity:1; } 50% { opacity:.45; } }
  @keyframes baslikParla { 0%,100% { filter:drop-shadow(0 0 6px rgba(124,77,255,.5)); }
                           50% { filter:drop-shadow(0 0 14px rgba(0,229,255,.6)); } }
  @keyframes logoParla { 0%,100% { box-shadow:0 0 22px rgba(124,77,255,.5), 0 0 50px rgba(0,229,255,.12); }
                         50% { box-shadow:0 0 34px rgba(124,77,255,.7), 0 0 70px rgba(0,229,255,.28); } }
  @keyframes arkaPlan { 0%,100% { opacity:.75; } 50% { opacity:1; } }

  /* Hareketi azalt ayarı açıksa animasyonları kapat */
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div id="oyun">
  <h1>KRİTİK SEÇİM ESPOR</h1>

  <!-- ANA MENÜ -->
  <div id="ekranMenu" class="ekran">
    <canvas id="logoCanvas" class="logo" width="512" height="512"></canvas>
    <div class="rekorBaslik">🏆 REKORLAR (HAFTA)</div>
    <div class="rekorKutu">
      <div>Orta<b id="menuRekorOrta">0</b></div>
      <div>Zor<b id="menuRekorZor">0</b></div>
      <div>Çok Zor<b id="menuRekorCokZor">0</b></div>
    </div>
    <div class="menu-liste">
      <button id="btnDevamEt"></button>
      <button id="btnYeniOyun">🎮 Yeni Oyun</button>
      <button id="btnGeriBildirim" class="ikincil">💬 Geri Bildirim</button>
      <button id="btnSesMenu" class="ikincil"></button>
    </div>
  </div>

  <!-- MOD SEÇİMİ -->
  <div id="ekranMod" class="ekran">
    <h2>Zorluk Seç</h2>
    <div class="menu-liste">
      <button class="mod-btn" id="modOrta"><b>Orta</b><small>Daha rahat. Giderler düşük, zorluk yavaş artar.</small><small class="rekorEtiket" id="modRekorOrta"></small></button>
      <button class="mod-btn" id="modZor"><b>Zor</b><small>Dengeli ve zorlu. Standart deneyim.</small><small class="rekorEtiket" id="modRekorZor"></small></button>
      <button class="mod-btn" id="modCokZor"><b>Çok Zor</b><small>Acımasız. Yüksek gider, hızlı zorluk, düşük şans.</small><small class="rekorEtiket" id="modRekorCokZor"></small></button>
      <button class="ikincil" id="btnModGeri">← Geri</button>
    </div>
  </div>

  <!-- GERİ BİLDİRİM -->
  <div id="ekranGeriBildirim" class="ekran">
    <h2>Geri Bildirim</h2>
    <textarea id="geriBildirimMetin" placeholder="Fikirlerini, hataları veya önerilerini yaz..."></textarea>
    <div class="menu-liste" style="margin-top:12px;">
      <button id="btnGonder">📧 E-posta ile Gönder</button>
      <button class="ikincil" id="btnGeriBildirimGeri">← Geri</button>
    </div>
    <div class="not">Butona basınca e-posta uygulaman açılır.<br>
      Açılmazsa mesajını şu adrese kendin gönderebilirsin:<br>
      <b>kritiksecimespor@gmail.com</b></div>
  </div>

  <!-- OYUN EKRANI -->
  <div id="ekranOyun" class="ekran">
    <div class="ustBar">
      <button class="menu-kucuk ikincil" id="btnMenu">☰ Menü</button>
      <button class="menu-kucuk ikincil" id="btnSesOyun"></button>
    </div>

    <div class="stats">
      <div class="stat">💰 Bütçe<div class="bar"><div class="dolu" id="butce"></div></div></div>
      <div class="stat">🏆 Form<div class="bar"><div class="dolu" id="form"></div></div></div>
      <div class="stat">📣 Taraftar<div class="bar"><div class="dolu" id="taraftar"></div></div></div>
      <div class="stat">🧠 Moral<div class="bar"><div class="dolu" id="moral"></div></div></div>
    </div>

    <div id="kart"></div>
    <div class="butonlar">
      <button id="btnA"></button>
      <button id="btnB"></button>
    </div>
    <div id="sayac"></div>
    <div id="tehlikeYazi"></div>
  </div>
</div>

<!-- Kartlar ayrı dosyadan yüklenir -->
<script src="kartlar.js"></script>

<script>
  // ---------- AYARLAR ----------
  const EPOSTA = "kritiksecimespor@gmail.com";
  const KAYIT_ANAHTARI = "kritikSecimEsporKayit";
  const REKOR_ANAHTARI = "kritikSecimEsporRekor";
  const SES_ANAHTARI = "kritikSecimEsporSes";
  const isimler = { butce:"💰 Bütçe", form:"🏆 Form", taraftar:"📣 Taraftar", moral:"🧠 Moral" };

  // Zorluk modları. "zor" oyunun önceki haliyle aynıdır.
  // gider: haftalık bütçe gideri | taban: olumsuz etki çarpanı (başlangıç)
  // seviyeHafta: kaç haftada bir seviye atlanır | artis: seviye başına çarpan artışı
  // max: çarpan üst sınırı | baslangic: göstergelerin başlangıç değeri
  // sans: 🎲 risk şansına eklenen değer
  const MODLAR = {
    orta:   { ad:"Orta",    gider:1, taban:0.8,  seviyeHafta:7, artis:0.05, max:1.5, baslangic:55, sans:+0.1 },
    zor:    { ad:"Zor",     gider:2, taban:1.0,  seviyeHafta:5, artis:0.10, max:2.0, baslangic:50, sans:0 },
    cokzor: { ad:"Çok Zor", gider:3, taban:1.15, seviyeHafta:4, artis:0.15, max:2.5, baslangic:45, sans:-0.1 }
  };

  // ---------- OYUN DEĞİŞKENLERİ ----------
  let stats, hafta, mod, kart, kartIndex, deste, sonKart, asama;
  // asama: "soru" (kart gösteriliyor), "sonuc" (sonuç gösteriliyor), "bitti" (oyun bitti)

  // ---------- İKON / LOGO ÇİZİMİ ----------
  // Resim dosyası yok: logo, tarayıcıda çizilir. Aynı çizim hem ana menüde
  // hem de ana ekran (uygulama) ikonunda kullanılır.
  function ikonCiz(c) {
    const x = c.getContext("2d");
    const s = c.width;

    // Koyu zemin (tam dolu kare: iPhone köşeleri kendisi yuvarlar)
    x.fillStyle = "#0d0f1a";
    x.fillRect(0, 0, s, s);

    // Mor ve mavi ışık hâleleri
    let g = x.createRadialGradient(s * 0.2, s * 0.15, 0, s * 0.2, s * 0.15, s * 0.75);
    g.addColorStop(0, "rgba(124,77,255,0.60)");
    g.addColorStop(1, "rgba(124,77,255,0)");
    x.fillStyle = g;
    x.fillRect(0, 0, s, s);

    g = x.createRadialGradient(s * 0.85, s * 0.9, 0, s * 0.85, s * 0.9, s * 0.7);
    g.addColorStop(0, "rgba(0,229,255,0.45)");
    g.addColorStop(1, "rgba(0,229,255,0)");
    x.fillStyle = g;
    x.fillRect(0, 0, s, s);

    // Neon altıgen
    const cx = s / 2, cy = s * 0.46, r = s * 0.32;
    x.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (-90 + i * 60) * Math.PI / 180;
      const px = cx + r * Math.cos(a);
      const py = cy + r * Math.sin(a);
      if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
    }
    x.closePath();
    x.fillStyle = "rgba(20,24,48,0.85)";
    x.fill();

    const kenar = x.createLinearGradient(0, 0, s, s);
    kenar.addColorStop(0, "#7c4dff");
    kenar.addColorStop(1, "#00e5ff");
    x.lineWidth = s * 0.028;
    x.lineJoin = "round";
    x.strokeStyle = kenar;
    x.shadowColor = "#7c4dff";
    x.shadowBlur = s * 0.05;
    x.stroke();

    // KS harfleri
    x.shadowBlur = s * 0.035;
    x.shadowColor = "#00e5ff";
    const yazi = x.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
    yazi.addColorStop(0, "#9e7bff");
    yazi.addColorStop(1, "#00e5ff");
    x.fillStyle = yazi;
    x.font = "bold " + Math.round(s * 0.30) + "px Arial, Helvetica, sans-serif";
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.fillText("KS", cx, cy + s * 0.01);

    // E S P O R yazısı
    x.shadowBlur = 0;
    x.fillStyle = "#e8eaf6";
    x.font = "bold " + Math.round(s * 0.085) + "px Arial, Helvetica, sans-serif";
    x.fillText("E S P O R", cx, s * 0.885);
  }

  // Tarayıcı sekmesi ve iPhone "Ana Ekrana Ekle" için ikonu hazırla
  function ikonuHazirla() {
    try {
      const c = document.createElement("canvas");
      c.width = 512;
      c.height = 512;
      ikonCiz(c);
      const url = c.toDataURL("image/png");
      ["apple-touch-icon", "icon"].forEach(function (rel) {
        const l = document.createElement("link");
        l.rel = rel;
        if (rel === "icon") l.type = "image/png";
        l.href = url;
        document.head.appendChild(l);
      });
    } catch (e) {}
  }

  // ---------- SES SİSTEMİ ----------
  // Sesler dosyadan değil, tarayıcının kendi ses motoruyla üretilir.
  let sesAcik = true;
  try { sesAcik = localStorage.getItem(SES_ANAHTARI) !== "kapali"; } catch (e) {}
  let ac = null;

  function sesBaslat() {
    if (!ac) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ac = new AC();
      } catch (e) {}
    }
    if (ac && ac.state === "suspended") ac.resume();
  }

  // Tek bir nota çalar: frekans, başlangıç gecikmesi, süre, dalga tipi, ses seviyesi
  function nota(frekans, gecikme, sure, tip, seviye) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = tip || "sine";
    o.frequency.value = frekans;
    const t = ac.currentTime + gecikme;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(seviye || 0.15, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(g);
    g.connect(ac.destination);
    o.start(t);
    o.stop(t + sure + 0.03);
  }

  function sesCal(ad) {
    if (!sesAcik) return;
    sesBaslat();
    if (!ac) return;
    try {
      switch (ad) {
        case "tikla":
          nota(520, 0, 0.07, "triangle", 0.1);
          break;
        case "basari":
          nota(523, 0.00, 0.14, "sine", 0.16);
          nota(659, 0.09, 0.14, "sine", 0.16);
          nota(784, 0.18, 0.14, "sine", 0.16);
          nota(1047, 0.27, 0.30, "sine", 0.16);
          break;
        case "basarisiz":
          nota(300, 0.00, 0.22, "sawtooth", 0.09);
          nota(220, 0.16, 0.34, "sawtooth", 0.09);
          break;
        case "tehlike":
          nota(180, 0.00, 0.14, "square", 0.07);
          nota(180, 0.20, 0.14, "square", 0.07);
          break;
        case "seviye":
          nota(600, 0.00, 0.14, "triangle", 0.15);
          nota(800, 0.14, 0.26, "triangle", 0.15);
          break;
        case "bitti":
          nota(392, 0.00, 0.28, "square", 0.08);
          nota(330, 0.22, 0.28, "square", 0.08);
          nota(262, 0.44, 0.28, "square", 0.08);
          nota(196, 0.66, 0.55, "square", 0.08);
          break;
        case "rekor":
          nota(523, 0.00, 0.14, "triangle", 0.16);
          nota(659, 0.12, 0.14, "triangle", 0.16);
          nota(784, 0.24, 0.14, "triangle", 0.16);
          nota(1047, 0.36, 0.16, "triangle", 0.16);
          nota(784, 0.50, 0.12, "triangle", 0.16);
          nota(1047, 0.60, 0.45, "triangle", 0.16);
          break;
      }
    } catch (e) {}
  }

  function sesDugmeleriniGuncelle() {
    document.getElementById("btnSesMenu").textContent = sesAcik ? "🔊 Ses: Açık" : "🔇 Ses: Kapalı";
    document.getElementById("btnSesOyun").textContent = sesAcik ? "🔊" : "🔇";
  }

  function sesDegistir() {
    sesAcik = !sesAcik;
    try { localStorage.setItem(SES_ANAHTARI, sesAcik ? "acik" : "kapali"); } catch (e) {}
    sesDugmeleriniGuncelle();
  }

  // Her butona basınca kısa tık sesi (ses açıksa)
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button")) sesCal("tikla");
  });

  // ---------- EFEKTLER ----------
  // Karta bir animasyon sınıfı verir (öncekileri temizleyip yeniden başlatır)
  function efekt(sinif) {
    const k = document.getElementById("kart");
    k.classList.remove("giris", "efektBasari", "efektBasarisiz", "efektBitti");
    void k.offsetWidth;   // animasyonun yeniden başlaması için gerekli
    k.classList.add(sinif);
  }

  // Değişen göstergeyi yeşil/kırmızı yaktır
  function gostergeFlas(onceki) {
    for (const ad in stats) {
      const kutu = document.getElementById(ad).parentElement.parentElement;
      kutu.classList.remove("artti", "azaldi");
      void kutu.offsetWidth;
      if (stats[ad] > onceki[ad]) kutu.classList.add("artti");
      else if (stats[ad] < onceki[ad]) kutu.classList.add("azaldi");
    }
  }

  // ---------- EKRAN YÖNETİMİ ----------
  function ekranGoster(ad) {
    const ekranlar = ["ekranMenu", "ekranMod", "ekranGeriBildirim", "ekranOyun"];
    ekranlar.forEach(function (e) {
      document.getElementById(e).classList.toggle("aktif", e === ad);
    });
  }

  // ---------- KAYIT (telefonda saklanır) ----------
  function kaydet() {
    try {
      localStorage.setItem(KAYIT_ANAHTARI, JSON.stringify({
        stats: stats, hafta: hafta, mod: mod, deste: deste,
        sonKart: sonKart, kartIndex: kartIndex, asama: asama
      }));
    } catch (e) {}
  }

  function kayitOku() {
    try {
      const v = localStorage.getItem(KAYIT_ANAHTARI);
      if (!v) return null;
      const k = JSON.parse(v);
      if (!k || !MODLAR[k.mod] || !k.stats || typeof k.hafta !== "number") return null;
      if (typeof k.kartIndex !== "number" || k.kartIndex < 0 || k.kartIndex >= kartlar.length) return null;
      return k;
    } catch (e) { return null; }
  }

  function kayitSil() {
    try { localStorage.removeItem(KAYIT_ANAHTARI); } catch (e) {}
  }

  // ---------- REKORLAR ----------
  function rekorlariOku() {
    try {
      const v = localStorage.getItem(REKOR_ANAHTARI);
      const r = v ? JSON.parse(v) : {};
      return { orta: Number(r.orta) || 0, zor: Number(r.zor) || 0, cokzor: Number(r.cokzor) || 0 };
    } catch (e) {
      return { orta:0, zor:0, cokzor:0 };
    }
  }

  function rekorlariKaydet(r) {
    try { localStorage.setItem(REKOR_ANAHTARI, JSON.stringify(r)); } catch (e) {}
  }

  function rekorYazisi(deger) {
    return deger > 0 ? "🏆 Rekor: " + deger + " hafta" : "🏆 Henüz rekor yok";
  }

  function rekorlariGoster() {
    const r = rekorlariOku();
    document.getElementById("menuRekorOrta").textContent = r.orta;
    document.getElementById("menuRekorZor").textContent = r.zor;
    document.getElementById("menuRekorCokZor").textContent = r.cokzor;
    document.getElementById("modRekorOrta").textContent = rekorYazisi(r.orta);
    document.getElementById("modRekorZor").textContent = rekorYazisi(r.zor);
    document.getElementById("modRekorCokZor").textContent = rekorYazisi(r.cokzor);
  }

  // ---------- ANA MENÜ ----------
  function menuyuGuncelle() {
    const k = kayitOku();
    const btn = document.getElementById("btnDevamEt");
    if (k) {
      btn.disabled = false;
      btn.innerHTML = "▶️ Devam Et<small>" + MODLAR[k.mod].ad + " · Hafta " + k.hafta + "</small>";
    } else {
      btn.disabled = true;
      btn.innerHTML = "▶️ Devam Et<small>Kayıtlı oyun yok</small>";
    }
    rekorlariGoster();
    sesDugmeleriniGuncelle();
  }

  function menuyeDon() {
    menuyuGuncelle();
    ekranGoster("ekranMenu");
  }

  // ---------- ZORLUK HESAPLARI ----------
  function seviyeHesapla(h) {
    return Math.floor((h - 1) / MODLAR[mod].seviyeHafta) + 1;
  }
  function carpanHesapla(h) {
    const m = MODLAR[mod];
    return Math.min(m.max, m.taban + m.artis * (seviyeHesapla(h) - 1));
  }

  function sinirla(x) { return Math.max(0, Math.min(100, x)); }

  // ---------- OYUN EKRANI ----------
  function ekraniGuncelle() {
    const tehlikeli = [];
    for (const ad in stats) {
      const bar = document.getElementById(ad);
      bar.style.width = stats[ad] + "%";
      const tehlikede = stats[ad] <= 20;
      bar.classList.toggle("tehlike", tehlikede);
      if (tehlikede) tehlikeli.push(isimler[ad]);
    }
    document.getElementById("sayac").textContent =
      MODLAR[mod].ad + "  ·  Hafta: " + hafta + "  ·  Seviye: " + seviyeHesapla(hafta);
    document.getElementById("tehlikeYazi").textContent =
      tehlikeli.length > 0 ? "⚠️ Tehlikede: " + tehlikeli.join(", ") : "";
  }

  // Desteyi karıştırır; aynı kart arka arkaya gelmesin diye kontrol eder
  function desteyiKaristir() {
    const d = kartlar.map(function (_, i) { return i; });
    for (let i = d.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [d[i], d[j]] = [d[j], d[i]];
    }
    if (d[d.length - 1] === sonKart && d.length > 1) {
      [d[d.length - 1], d[0]] = [d[0], d[d.length - 1]];
    }
    return d;
  }

  function kartiGoster(index, uyari) {
    kartIndex = index;
    kart = kartlar[index];
    asama = "soru";
    document.getElementById("kart").innerHTML =
      (uyari ? '<div class="uyari">' + uyari + "</div>" : "") + kart.metin;
    efekt("giris");
    document.getElementById("btnA").textContent = kart.A.risk ? "🎲 " + kart.A.yazi : kart.A.yazi;
    document.getElementById("btnB").textContent = kart.B.risk ? "🎲 " + kart.B.yazi : kart.B.yazi;
    document.getElementById("btnB").style.display = "";
  }

  function yeniKart(uyari) {
    if (deste.length === 0) deste = desteyiKaristir();
    const index = deste.pop();
    sonKart = index;
    kartiGoster(index, uyari);
    kaydet();
  }

  function etkiYazisi(etki) {
    let html = "";
    for (const ad in etki) {
      const d = etki[ad];
      const sinif = d > 0 ? "art" : "azal";
      const isaret = d > 0 ? "+" : "";
      html += '<span class="' + sinif + '">' + isimler[ad] + " " + isaret + d + "</span><br>";
    }
    return html;
  }

  function sec(secim) {
    const m = MODLAR[mod];
    const secenek = kart[secim];
    let metin, etki, baslik = "", riskli = false, basarili = false;

    if (secenek.risk) {
      const sans = Math.min(0.9, Math.max(0.1, secenek.risk.sans + m.sans));
      basarili = Math.random() < sans;
      riskli = true;
      const sonuc = basarili ? secenek.risk.basari : secenek.risk.basarisiz;
      baslik = basarili
        ? '<div class="basari">🎲 RİSK BAŞARILI!</div><br>'
        : '<div class="basarisiz">🎲 RİSK BAŞARISIZ!</div><br>';
      metin = sonuc.metin;
      etki = sonuc.etki;
    } else {
      metin = secenek.sonuc;
      etki = secenek.etki;
    }

    // Zorluk: olumsuz etkiler moda ve seviyeye göre büyür/küçülür
    const carpan = carpanHesapla(hafta);
    const olcekli = {};
    for (const ad in etki) {
      const d = etki[ad];
      olcekli[ad] = d < 0 ? Math.round(d * carpan) : d;
    }

    const onceki = Object.assign({}, stats);
    for (const ad in olcekli) {
      stats[ad] = sinirla(stats[ad] + olcekli[ad]);
    }
    // Haftalık gider
    stats.butce = sinirla(stats.butce - m.gider);
    ekraniGuncelle();
    gostergeFlas(onceki);

    // Sesler: riskli seçimde sonuç sesi, ayrıca yeni tehlikeye giren gösterge varsa uyarı
    if (riskli) sesCal(basarili ? "basari" : "basarisiz");
    let yeniTehlike = false;
    for (const ad in stats) {
      if (stats[ad] <= 20 && onceki[ad] > 20) yeniTehlike = true;
    }
    if (yeniTehlike) {
      setTimeout(function () { sesCal("tehlike"); }, riskli ? 650 : 150);
    }

    document.getElementById("kart").innerHTML =
      baslik + metin +
      '<div class="etki">' + etkiYazisi(olcekli) +
      '<span class="gider">🧾 Haftalık gider: 💰 Bütçe -' + m.gider + "</span></div>";
    efekt(riskli ? (basarili ? "efektBasari" : "efektBasarisiz") : "giris");
    document.getElementById("btnA").textContent = "Devam";
    document.getElementById("btnB").style.display = "none";
    asama = "sonuc";
    kaydet();
  }

  function devam() {
    // Sadece bir gösterge 0'a düştüyse oyun biter
    for (const ad in stats) {
      if (stats[ad] <= 0) {
        asama = "bitti";
        kayitSil();

        // Rekor kontrolü
        const rekorlar = rekorlariOku();
        const eskiRekor = rekorlar[mod];
        let rekorHtml;
        if (hafta > eskiRekor) {
          rekorlar[mod] = hafta;
          rekorlariKaydet(rekorlar);
          rekorHtml = '<div class="yeniRekor">🏆 YENİ REKOR!</div>';
          sesCal("rekor");
        } else {
          rekorHtml = '<div class="rekorBilgi">🏆 ' + MODLAR[mod].ad + " rekorun: " + eskiRekor + " hafta</div>";
          sesCal("bitti");
        }

        document.getElementById("kart").innerHTML =
          "<b>OYUN BİTTİ</b><br><br>" + isimler[ad] + " tükendi.<br>" +
          hafta + " hafta dayandın. Mod: " + MODLAR[mod].ad +
          " · Seviye: " + seviyeHesapla(hafta) + rekorHtml;
        efekt("efektBitti");
        document.getElementById("btnA").textContent = "Yeniden Başla";
        document.getElementById("btnB").textContent = "Ana Menü";
        document.getElementById("btnB").style.display = "";
        return;
      }
    }
    const eskiSeviye = seviyeHesapla(hafta);
    const eskiCarpan = carpanHesapla(hafta);
    hafta++;
    const yeniSeviye = seviyeHesapla(hafta);
    let uyari = "";
    if (yeniSeviye > eskiSeviye) {
      const yuzde = Math.round((carpanHesapla(hafta) / eskiCarpan - 1) * 100);
      uyari = yuzde > 0
        ? "⚠️ SEVİYE " + yeniSeviye + ": Olumsuz etkiler %" + yuzde + " arttı!"
        : "⚠️ SEVİYE " + yeniSeviye + ": Zorluk en üst sınırda!";
      sesCal("seviye");
    }
    ekraniGuncelle();
    yeniKart(uyari);
  }

  // ---------- OYUN BAŞLAT / DEVAM ----------
  function yeniOyunBaslat(modAdi) {
    mod = modAdi;
    const b = MODLAR[mod].baslangic;
    stats = { butce:b, form:b, taraftar:b, moral:b };
    hafta = 1;
    deste = [];
    sonKart = -1;
    ekranGoster("ekranOyun");
    ekraniGuncelle();
    yeniKart();
  }

  function devamEt() {
    const k = kayitOku();
    if (!k) return;
    stats = k.stats;
    hafta = k.hafta;
    mod = k.mod;
    sonKart = k.sonKart;
    deste = (k.deste || []).filter(function (i) { return i >= 0 && i < kartlar.length; });
    ekranGoster("ekranOyun");
    ekraniGuncelle();
    if (k.asama === "sonuc") {
      devam();               // sonuç ekranındayken çıkıldıysa bir sonraki karta geç
    } else {
      kartiGoster(k.kartIndex);
    }
  }

  // ---------- GERİ BİLDİRİM ----------
  function geriBildirimGonder() {
    const metin = document.getElementById("geriBildirimMetin").value.trim();
    const konu = "Kritik Seçim Espor - Geri Bildirim";
    const govde = (metin || "") + "\n\n(Oyun: Kritik Seçim Espor)";
    window.location.href = "mailto:" + EPOSTA +
      "?subject=" + encodeURIComponent(konu) +
      "&body=" + encodeURIComponent(govde);
  }

  // ---------- BUTON BAĞLANTILARI ----------
  document.getElementById("btnDevamEt").onclick = devamEt;
  document.getElementById("btnYeniOyun").onclick = function () {
    if (kayitOku() && !confirm("Kayıtlı oyunun silinecek. Yeni oyun başlatılsın mı?")) return;
    rekorlariGoster();
    ekranGoster("ekranMod");
  };
  document.getElementById("btnGeriBildirim").onclick = function () { ekranGoster("ekranGeriBildirim"); };
  document.getElementById("btnSesMenu").onclick = sesDegistir;
  document.getElementById("btnSesOyun").onclick = sesDegistir;

  document.getElementById("modOrta").onclick = function () { yeniOyunBaslat("orta"); };
  document.getElementById("modZor").onclick = function () { yeniOyunBaslat("zor"); };
  document.getElementById("modCokZor").onclick = function () { yeniOyunBaslat("cokzor"); };
  document.getElementById("btnModGeri").onclick = menuyeDon;

  document.getElementById("btnGonder").onclick = geriBildirimGonder;
  document.getElementById("btnGeriBildirimGeri").onclick = menuyeDon;

  document.getElementById("btnMenu").onclick = menuyeDon;

  document.getElementById("btnA").onclick = function () {
    if (asama === "soru") sec("A");
    else if (asama === "sonuc") devam();
    else yeniOyunBaslat(mod);       // oyun bitti: aynı modda yeniden başla
  };
  document.getElementById("btnB").onclick = function () {
    if (asama === "soru") sec("B");
    else if (asama === "bitti") menuyeDon();
  };

  // ---------- AÇILIŞ ----------
  try { ikonCiz(document.getElementById("logoCanvas")); } catch (e) {}
  ikonuHazirla();
  menuyeDon();
</script>
</body>
